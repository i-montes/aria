<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aria · Composer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
/* scrollbar: pill that is clearly there at rest, thicker on hover, lavender when grabbed */
.aria-scroll::-webkit-scrollbar{width:14px;height:14px}
.aria-scroll::-webkit-scrollbar-track{background:transparent}
.aria-scroll::-webkit-scrollbar-corner{background:transparent}
.aria-scroll::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,0.16);border:4px solid transparent;background-clip:padding-box;border-radius:999px}
.aria-scroll:hover::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,0.28)}
.aria-scroll::-webkit-scrollbar-thumb:hover{background-color:rgba(185,168,255,0.7);border-width:2px}
.aria-scroll::-webkit-scrollbar-thumb:active{background-color:#B9A8FF;border-width:2px}
@supports not selector(::-webkit-scrollbar){.aria-scroll{scrollbar-width:auto;scrollbar-color:rgba(255,255,255,0.28) transparent}}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 9px; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #EDEDEF">
  <div style="display: flex; align-items: flex-end; gap: 8px; background: rgba(22, 22, 26, 0.96); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 6px 6px 6px 16px">
    <div style="position: relative; flex: 1 1 auto; min-width: 0">
      <label for="aria-composer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Message for Aria</label>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ true }}">
        <span aria-hidden="true" style="position: absolute; left: 0; top: 11px; line-height: 22px; pointer-events: none; font-size: 14.5px; color: #8A8A94">{{placeholder}}</span>
      </sc-if>
      <textarea id="aria-composer" class="aria-scroll" rows="{{rows}}" value="{{value}}" onChange="{{change}}" onKeyDown="{{keyDown}}" style="display: block; width: 100%; min-height: 44px; max-height: 154px; box-sizing: border-box; field-sizing: content; resize: none; overflow-x: hidden; overflow-y: auto; background: transparent; border: 0; outline: none; padding: 11px 0; color: #F4F4F5; font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 14.5px; line-height: 22px; overflow-wrap: anywhere"></textarea>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 6px; flex: 0 0 auto">
            <sc-if value="{{showStop}}" hint-placeholder-val="{{ false }}">
              <button type="button" aria-label="Stop" title="Stop" onClick="{{stop}}" style-focus-visible="outline: 2px solid #B9A8FF; outline-offset: 2px" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: 0 0 44px; box-sizing: border-box; padding: 0; border-radius: 10px; border: {{stopBorder}}; background: {{stopBg}}; color: {{stopColor}}; cursor: pointer; transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease">
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"></rect></svg>
              </button>
            </sc-if>
            <sc-if value="{{showQueue}}" hint-placeholder-val="{{ false }}">
              <button type="button" aria-label="Queue message" title="Queue it for when Aria finishes" onClick="{{send}}" style-focus-visible="outline: 2px solid #B9A8FF; outline-offset: 2px" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: 0 0 44px; box-sizing: border-box; padding: 0; border-radius: 10px; border: 1px solid rgba(185, 168, 255, 0.4); background: rgba(185, 168, 255, 0.16); color: #D6CCFF; cursor: pointer">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"></circle><path d="M12 10v3l2 1.5M9.5 3h5"></path></svg>
              </button>
            </sc-if>
            <sc-if value="{{showSend}}" hint-placeholder-val="{{ true }}">
              <button type="button" aria-label="Send" onClick="{{send}}" style="width: 44px; height: 44px; flex: 0 0 44px; border-radius: 10px; border: 0; background: {{accent}}; color: #0B0816; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
              </button>
            </sc-if>
          </div>
  </div>
  <sc-if value="{{showHints}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; gap: 14px; flex-wrap: wrap; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #9A9AA3; padding-left: 4px">
      <span>type <kbd style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #F4F4F5; background: #1C1C21; border: 1px solid #34343B; border-radius: 5px; padding: 0 6px">/</kbd> for commands</span>
      <span><span style="color: #D6D6DC">alt+a</span> subagents</span>
      <span><span style="color: #D6D6DC">enter</span> send · <span style="color: #D6D6DC">shift+enter</span> new line</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"placeholder":{"editor":"text","default":"Message Aria…"},"busy":{"editor":"boolean","default":false},"onStop":{"editor":null},"showHints":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#B9A8FF","options":["#B9A8FF","#7DD3FC","#9BE7C4","#F4F4F5"]},"onSend":{"editor":null},"$preview":{"width":448,"height":90}}'>
class Component extends DCLogic {
  renderVals() {
    const value = (this.state && this.state.value) || '';
    const onSend = this.props.onSend ?? (() => {});
    return {
      value: value,
      empty: value.length === 0,
      rows: Math.min(6, Math.max(1, value.split('\n').reduce((n, l) => n + Math.max(1, Math.ceil(l.length / 46)), 0))),
      placeholder: this.props.busy === true ? 'Queue a message…' : (this.props.placeholder ?? 'Message Aria…'),
      showHints: this.props.showHints !== false,
      accent: this.props.accent ?? '#B9A8FF',
      showSend: this.props.busy !== true,
      showStop: this.props.busy === true,
      showQueue: this.props.busy === true && value.trim().length > 0,
      stopBg: value.trim().length > 0 ? 'transparent' : '#F4F4F5',
      stopColor: value.trim().length > 0 ? '#F4F4F5' : '#0B0B0D',
      stopBorder: value.trim().length > 0 ? '1px solid rgba(255, 255, 255, 0.2)' : '1px solid transparent',
      stop: this.props.onStop ?? (() => {}),
      change: (e) => this.setState({ value: e.target.value }),
      send: () => { if (value.trim()) { onSend(value); this.setState({ value: '' }); } },
      keyDown: (e) => { if (e.key === 'Enter' && !e.shiftKey && !(e.nativeEvent && e.nativeEvent.isComposing)) { e.preventDefault(); if (value.trim()) { onSend(value); this.setState({ value: '' }); } } }
    };
  }
}
</script>
</body>
</html>
