<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aria · Phases</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
@keyframes ph-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .ph, .ph *{animation:none !important}
}
</style>
</helmet>
<div class="ph" style="width: 100%; max-width: 400px; box-sizing: border-box; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #EDEDEF; animation: ph-up 300ms cubic-bezier(0.22, 1, 0.36, 1) both">
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 14px 16px; border-radius: 16px 16px 16px 4px; background: rgba(17, 17, 20, 0.94); border: 1px solid rgba(255, 255, 255, 0.07)">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #B4B4BC">
      <span style="display: inline-flex; align-items: center; gap: 8px">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 14px"><path d="M4 6h16M4 12h10M4 18h6"></path></svg>
        PHASES
      </span>
      <span style="letter-spacing: 0; color: #9A9AA3; font-variant-numeric: tabular-nums">{{summary}}</span>
    </div>

    <ol style="display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none">
      <sc-for list="{{phases}}" as="p" hint-placeholder-count="3">
        <li style="position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 12px; animation: ph-up 320ms cubic-bezier(0.22, 1, 0.36, 1) {{p.delay}}ms both">
          <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: rgba(185, 168, 255, 0.14); color: #B9A8FF; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500">{{p.number}}</span>
          <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
              <span style="min-width: 0; font-size: 13.5px; font-weight: 600; line-height: 24px; color: #F4F4F5; overflow-wrap: anywhere">{{p.name}}</span>
              <span style="flex: 0 0 auto; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: #9A9AA3">{{p.countText}}</span>
            </div>
            <ul style="display: flex; flex-direction: column; gap: 3px; margin: 0; padding: 0; list-style: none">
              <sc-for list="{{p.tasks}}" as="t" hint-placeholder-count="2">
                <li style="display: grid; grid-template-columns: 10px minmax(0, 1fr); column-gap: 8px; align-items: start; font-size: 12.5px; line-height: 1.5; color: #B4B4BC">
                  <span aria-hidden="true" style="width: 4px; height: 4px; margin: 8px 0 0 3px; border-radius: 50%; background: #55555E"></span>
                  <span style="min-width: 0; overflow-wrap: anywhere">{{t.text}}</span>
                </li>
              </sc-for>
            </ul>
          </div>
        </li>
      </sc-for>
    </ol>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phases":{"editor":null},"$preview":{"width":448,"height":360}}'>
class Component extends DCLogic {
  defaults() {
    return [
      { name: 'Contract and producer', tasks: ['Define the queue message contract', 'Producer in the send endpoint'] },
      { name: 'Consumer', tasks: ['Consumer with retries and a dead-letter queue'] },
      { name: 'Verify and clean up', tasks: ['Tests with a simulated bulk send', 'Remove direct sending'] }
    ];
  }
  renderVals() {
    const list = (this.props.phases && this.props.phases.length) ? this.props.phases : this.defaults();
    const total = list.reduce((n, p) => n + (p.tasks || []).length, 0);
    return {
      summary: list.length + (list.length === 1 ? ' phase' : ' phases') + ' · ' + total + (total === 1 ? ' task' : ' tasks'),
      phases: list.map((p, i) => ({
        number: i + 1,
        name: p.name,
        countText: (p.tasks || []).length + ((p.tasks || []).length === 1 ? ' task' : ' tasks'),
        tasks: (p.tasks || []).map((t) => ({ text: t })),
        delay: 90 + i * 90
      }))
    };
  }
}
</script>
</body>
</html>
