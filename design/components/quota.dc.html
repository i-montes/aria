<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aria · Quota</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #EDEDEF; background: rgba(26, 20, 9, 0.96); border: 1px solid rgba(240, 180, 76, 0.42); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; color: #F0B44C; font-size: 13.5px; font-weight: 600">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span>{{title}}</span>
    </div>
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #F0B44C">{{percentText}}</span>
  </div>
  <div role="progressbar" aria-label="Quota used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{percent}}" style="height: 3px; border-radius: 2px; background: #3A2E17; overflow: hidden"><div style="width: {{width}}; height: 100%; background: #F0B44C"></div></div>
  <p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: #D6D6DC">{{question}}</p>
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <button onClick="{{onFree}}" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #F0B44C; color: #1A1205; font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer">Switch to free</button>
    <button onClick="{{onKeep}}" style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.14); background: transparent; color: #EDEDEF; font-family: Geist, ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; cursor: pointer">Keep subscription</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"OpenCode Go quota almost used up"},"question":{"editor":"text","default":"Should I switch to a free model for the rest of this task?"},"percent":{"editor":"range","min":0,"max":100,"step":1,"unit":"%","default":92},"onFree":{"editor":null},"onKeep":{"editor":null},"$preview":{"width":448,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    const p = Math.max(0, Math.min(100, this.props.percent ?? 92));
    const noop = () => {};
    return {
      title: this.props.title ?? 'OpenCode Go quota almost used up',
      question: this.props.question ?? 'Should I switch to a free model for the rest of this task?',
      percent: p,
      percentText: p + '% used',
      width: p + '%',
      onFree: this.props.onFree ?? noop,
      onKeep: this.props.onKeep ?? noop
    };
  }
}
</script>
</body>
</html>
