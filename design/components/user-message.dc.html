<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aria · User message</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
@keyframes us-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .us-root{animation:none !important} }
</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #F4F4F5; animation: {{rootAnimation}}">
  <p style="margin: 0; max-width: 82%; background: #2A2A31; color: #F4F4F5; border-radius: 16px 16px 4px 16px; padding: 11px 15px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; opacity: {{bubbleOpacity}}; outline: {{bubbleOutline}}; outline-offset: -1px; transition: opacity 200ms ease; font-family: {{font}}; font-size: {{size}}"><sc-for list="{{parts}}" as="s"><sc-if value="{{s.chip}}"><span style="display: inline-block; margin: 0 1px; padding: 0 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); color: #F4F4F5; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 20px; overflow-wrap: anywhere">{{s.t}}</span></sc-if><sc-if value="{{s.plain}}"><span>{{s.t}}</span></sc-if></sc-for></p>
  <sc-if value="{{queued}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; gap: 8px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; line-height: 16px; color: #9A9AA3">
      <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 12px"><circle cx="12" cy="13" r="7"></circle><path d="M12 10v3l2 1.5M9.5 3h5"></path></svg>
      <span>Queued · sends when Aria finishes</span>
      <button type="button" onClick="{{cancel}}" style-hover="color: #F4F4F5" style-focus-visible="outline: 2px solid #B9A8FF; outline-offset: 2px" style-after="content: ''; position: absolute; top: -14px; bottom: -14px; left: -8px; right: -8px" style="position: relative; padding: 0 2px; border: 0; background: transparent; color: #B4B4BC; font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; transition: color 120ms">Cancel</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"text":{"editor":"text","default":"The build has been failing since yesterday. Check the log and fix it."},"command":{"editor":"boolean","default":false},"queued":{"editor":"boolean","default":false},"onCancel":{"editor":null},"$preview":{"width":448,"height":72}}'>
class Component extends DCLogic {
  /* an @mention starts at the beginning or after a space, and stops before trailing punctuation */
  parts(text) {
    const out = [];
    const re = /@[^\s@]+/g;
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > 0 && !/\s/.test(text[m.index - 1])) continue;
      let tok = m[0];
      const trail = (tok.match(/[.,;:!?)]+$/) || [''])[0];
      if (trail) tok = tok.slice(0, tok.length - trail.length);
      if (tok.length < 2) continue;
      if (m.index > last) out.push({ t: text.slice(last, m.index), chip: false, plain: true });
      out.push({ t: tok, chip: true, plain: false });
      last = m.index + tok.length;
      re.lastIndex = last;
    }
    if (last < text.length) out.push({ t: text.slice(last), chip: false, plain: true });
    return out.length ? out : [{ t: text, chip: false, plain: true }];
  }
  renderVals() {
    const command = this.props.command === true;
    return {
      queued: this.props.queued === true,
      cancel: this.props.onCancel ?? (() => {}),
      bubbleOpacity: this.props.queued === true ? 0.72 : 1,
      bubbleOutline: this.props.queued === true ? '1px dashed rgba(255, 255, 255, 0.28)' : 'none',
      rootAnimation: this.props.queued === true ? 'us-up 280ms cubic-bezier(0.22, 1, 0.36, 1) both' : 'none',
      parts: this.parts(this.props.text ?? 'The build has been failing since yesterday. Check the log and fix it.'),
      text: this.props.text ?? 'The build has been failing since yesterday. Check the log and fix it.',
      font: command ? "'Geist Mono', ui-monospace, monospace" : 'Geist, ui-sans-serif, system-ui, sans-serif',
      size: command ? '13.5px' : '14.5px'
    };
  }
}
</script>
</body>
</html>
