<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aria · Subagents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 9px; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #EDEDEF">
  <ul aria-label="Subagents at work" style="margin: 0; padding: 6px; list-style: none; background: rgba(17, 17, 20, 0.94); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 16px 16px 16px 4px; display: flex; flex-direction: column">
    <sc-for list="{{agents}}" as="a" hint-placeholder-count="5">
      <li>
        <button type="button" onClick="{{a.select}}" aria-label="Open the {{a.role}} session" style="width: 100%; min-height: 44px; box-sizing: border-box; display: grid; grid-template-columns: 12px 92px minmax(0, 1fr) auto 14px; align-items: start; column-gap: 10px; padding: 10px 10px; line-height: 20px; background: transparent; border: 0; border-radius: 10px; text-align: left; color: #EDEDEF; font-family: Geist, ui-sans-serif, system-ui, sans-serif; cursor: pointer">
          <span aria-hidden="true" style="width: 7px; height: 7px; margin-top: 7px; border-radius: 50%; background: {{a.dot}}"></span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; color: #F4F4F5">{{a.role}}</span>
          <span style="min-width: 0; font-size: 13.5px; color: #B4B4BC; overflow-wrap: anywhere">{{a.task}}</span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; white-space: nowrap; color: {{a.statusColor}}">{{a.status}}</span>
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8A94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top: 3px"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </li>
    </sc-for>
  </ul>
  <p style="margin: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #9A9AA3; padding-left: 4px; overflow-wrap: anywhere">{{footnote}}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"agents":{"editor":null},"footnote":{"editor":"text","default":"select an agent to open its session"},"accent":{"editor":"color","default":"#B9A8FF","options":["#B9A8FF","#7DD3FC","#9BE7C4","#F4F4F5"]},"onSelect":{"editor":null},"$preview":{"width":448,"height":270}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#B9A8FF';
    const onSelect = this.props.onSelect ?? (() => {});
    const styles = {
      active: { dot: accent, statusColor: accent },
      done: { dot: '#F4F4F5', statusColor: '#F4F4F5' },
      queued: { dot: '#55555E', statusColor: '#9A9AA3' }
    };
    const base = [
      { role: 'researcher', task: 'magic-link best practices', status: 'done', kind: 'done' },
      { role: 'frontend', task: 'form and loading states', status: 'writing', kind: 'active' },
      { role: 'backend', task: 'endpoint and email delivery', status: 'testing', kind: 'active' },
      { role: 'security', task: 'expiry and rate limiting', status: 'reviewing', kind: 'active' },
      { role: 'reviewer', task: 'waits for frontend and backend', status: 'queued', kind: 'queued' }
    ];
    const agents = (this.props.agents ?? base).map((a) => Object.assign({}, a, styles[a.kind] ?? styles.queued, { select: () => onSelect(a.role) }));
    return { agents: agents, footnote: this.props.footnote ?? 'select an agent to open its session' };
  }
}
</script>
</body>
</html>
