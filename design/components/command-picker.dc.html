<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aria · Command picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050506}
.aria-scroll::-webkit-scrollbar{width:14px;height:14px}
.aria-scroll::-webkit-scrollbar-track{background:transparent}
.aria-scroll::-webkit-scrollbar-corner{background:transparent}
.aria-scroll::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,0.16);border:4px solid transparent;background-clip:padding-box;border-radius:999px}
.aria-scroll:hover::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,0.28)}
.aria-scroll::-webkit-scrollbar-thumb:hover{background-color:rgba(185,168,255,0.7);border-width:2px}
.aria-scroll::-webkit-scrollbar-thumb:active{background-color:#B9A8FF;border-width:2px}
@supports not selector(::-webkit-scrollbar){.aria-scroll{scrollbar-width:auto;scrollbar-color:rgba(255,255,255,0.28) transparent}}
@media (prefers-reduced-motion: reduce){
  .cp, .cp *{transition:none !important}
}
</style>
</helmet>
<div class="cp" style="width: 100%; box-sizing: border-box; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #EDEDEF; transform-origin: bottom center; opacity: {{opacity}}; transform: {{transform}}; visibility: {{visibility}}; pointer-events: {{pointerEvents}}; transition: opacity 160ms ease, transform 200ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear {{visibilityDelay}}">
  <div style="overflow: hidden; border-radius: 14px; background: rgba(20, 20, 23, 0.97); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55)">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px 6px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #8A8A94">
      <span>COMMANDS</span>
      <span style="letter-spacing: 0; font-variant-numeric: tabular-nums">{{countText}}</span>
    </div>

    <sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}">
      <ul ref="{{listRef}}" role="listbox" aria-label="Commands" class="aria-scroll" style="position: relative; margin: 0; padding: 2px 6px 6px; list-style: none; max-height: 288px; overflow-x: hidden; overflow-y: auto">
        <sc-for list="{{items}}" as="c" hint-placeholder-count="4">
          <li role="option" aria-selected="{{c.selected}}" id="{{c.domId}}">
            <button type="button" onClick="{{c.pick}}" onMouseMove="{{c.hover}}" style="display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; width: 100%; min-height: 44px; box-sizing: border-box; margin: 0; padding: 6px 8px; border: 0; border-radius: 10px; background: {{c.bg}}; color: inherit; font-family: Geist, ui-sans-serif, system-ui, sans-serif; text-align: left; cursor: pointer; transition: background-color 100ms">
              <span style="min-width: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; line-height: 18px; overflow-wrap: anywhere"><span style="color: #8A8A94">/</span><sc-for list="{{c.nameSegs}}" as="s"><span style="color: {{s.color}}; font-weight: {{s.weight}}">{{s.t}}</span></sc-for></span>
              <span style="min-width: 0; font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere"><sc-for list="{{c.descSegs}}" as="s"><span style="color: {{s.color}}; font-weight: {{s.weight}}">{{s.t}}</span></sc-for></span>
              <span style="display: flex; align-items: center; gap: 8px">
                <sc-if value="{{c.hasHint}}" hint-placeholder-val="{{ false }}"><kbd style="padding: 1px 6px; border: 1px solid #34343B; border-radius: 5px; background: #1C1C21; color: #B4B4BC; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; line-height: 16px">{{c.hint}}</kbd></sc-if>
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B9A8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 14px; opacity: {{c.enterOpacity}}; transition: opacity 120ms"><path d="M20 4v7a4 4 0 0 1-4 4H4"></path><path d="M9 10l-5 5 5 5"></path></svg>
              </span>
            </button>
          </li>
        </sc-for>
      </ul>
    </sc-if>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 14px 16px">
        <span style="font-size: 13px; line-height: 1.45; color: #C8C8CE; overflow-wrap: anywhere">No command matches “/{{query}}”</span>
        <span style="font-size: 12px; line-height: 1.45; color: #8A8A94">Press enter to send it as a message.</span>
      </div>
    </sc-if>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 14px 10px; border-top: 1px solid #26262B; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11.5px; color: #8A8A94">
      <span><kbd style="font-family: inherit; color: #D6D6DC">↑↓</kbd> navigate</span>
      <span><kbd style="font-family: inherit; color: #D6D6DC">↵</kbd> select</span>
      <span><kbd style="font-family: inherit; color: #D6D6DC">esc</kbd> close</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"query":{"editor":"text","default":""},"open":{"editor":"boolean","default":true},"commands":{"editor":null},"active":{"editor":null},"onPick":{"editor":null},"onActive":{"editor":null},"onFiltered":{"editor":null},"$preview":{"width":448,"height":440}}'>
class Component extends DCLogic {
  catalog() {
    if (this.props.commands && this.props.commands.length) return this.props.commands;
    return [
      { name: 'plan', description: 'Design and write a plan with a stronger model, before building' },
      { name: 'execute', description: 'Build the plan, task by task' },
      { name: 'agents', description: 'Show the subagents that are running', hint: 'alt+a' },
      { name: 'compact', description: 'Compact the context to save tokens' },
      { name: 'model', description: 'Choose which model Aria uses' },
      { name: 'memory', description: 'Search or save what Aria remembers' }
    ];
  }
  /* split a text into highlighted and plain pieces */
  segs(text, ranges, hlColor, hlWeight, baseColor, baseWeight) {
    const out = [];
    let pos = 0;
    ranges.forEach((r) => {
      if (r[0] > pos) out.push({ t: text.slice(pos, r[0]), color: baseColor, weight: baseWeight });
      out.push({ t: text.slice(r[0], r[1]), color: hlColor, weight: hlWeight });
      pos = r[1];
    });
    if (pos < text.length) out.push({ t: text.slice(pos), color: baseColor, weight: baseWeight });
    if (!out.length) out.push({ t: text, color: baseColor, weight: baseWeight });
    return out;
  }
  /* prefix first, then anywhere in the name, then letters in order, then the description */
  compute() {
    const q = String(this.props.query || '').trim().toLowerCase();
    const list = [];
    this.catalog().forEach((c, order) => {
      const name = c.name.toLowerCase();
      const desc = String(c.description || '');
      let score = null;
      let nameRanges = [];
      let descRanges = [];
      if (!q) score = 0;
      else if (name.startsWith(q)) { score = 0; nameRanges = [[0, q.length]]; }
      else if (name.indexOf(q) > -1) { const i = name.indexOf(q); score = 1 + i; nameRanges = [[i, i + q.length]]; }
      else {
        let pos = 0;
        const hit = [];
        for (let k = 0; k < name.length && pos < q.length; k++) {
          if (name[k] === q[pos]) { hit.push(k); pos++; }
        }
        if (pos === q.length) {
          score = 20 + (hit[hit.length - 1] - hit[0]);
          hit.forEach((k) => {
            const last = nameRanges[nameRanges.length - 1];
            if (last && last[1] === k) last[1] = k + 1; else nameRanges.push([k, k + 1]);
          });
        } else if (desc.toLowerCase().indexOf(q) > -1) {
          const i = desc.toLowerCase().indexOf(q);
          score = 60;
          descRanges = [[i, i + q.length]];
        }
      }
      if (score === null) return;
      list.push({ c: c, order: order, score: score, nameRanges: nameRanges, descRanges: descRanges });
    });
    list.sort((a, b) => (a.score - b.score) || (a.order - b.order));
    return list;
  }
  currentActive(n) {
    const a = this.props.active !== undefined && this.props.active !== null ? this.props.active : ((this.state || {}).active || 0);
    return Math.min(Math.max(0, a), Math.max(0, n - 1));
  }
  report() {
    const list = this.compute();
    const key = list.map((x) => x.c.name).join(',');
    if (key !== this.lastKey) {
      this.lastKey = key;
      if (this.props.onFiltered) this.props.onFiltered(list.map((x) => x.c.name));
    }
    return list;
  }
  keepVisible(list) {
    const a = this.currentActive(list.length);
    const item = list[a];
    if (!item || !this.listEl || !this.uid) return;
    const row = document.getElementById(this.uid + '-' + item.c.name);
    if (!row) return;
    const top = row.offsetTop;
    const bottom = top + row.offsetHeight;
    if (top < this.listEl.scrollTop) this.listEl.scrollTop = Math.max(0, top - 4);
    else if (bottom > this.listEl.scrollTop + this.listEl.clientHeight) this.listEl.scrollTop = bottom - this.listEl.clientHeight + 4;
  }
  componentDidMount() {
    this.report();
  }
  componentDidUpdate() {
    const list = this.report();
    this.keepVisible(list);
  }
  renderVals() {
    if (!this.uid) this.uid = 'cmd' + Math.random().toString(36).slice(2, 7);
    const list = this.compute();
    const n = list.length;
    const active = this.currentActive(n);
    const open = this.props.open !== false;
    const q = String(this.props.query || '').trim();
    const items = list.map((x, i) => {
      const on = i === active;
      return {
        domId: this.uid + '-' + x.c.name,
        selected: on ? 'true' : 'false',
        bg: on ? 'rgba(255, 255, 255, 0.07)' : 'transparent',
        enterOpacity: on ? 1 : 0,
        nameSegs: this.segs(x.c.name, x.nameRanges, '#B9A8FF', 600, '#F4F4F5', 500),
        descSegs: this.segs(String(x.c.description || ''), x.descRanges, '#F4F4F5', 500, '#9A9AA3', 400),
        hasHint: !!x.c.hint,
        hint: x.c.hint || '',
        pick: () => { if (this.props.onPick) this.props.onPick(x.c.name); },
        hover: () => {
          if (i === active) return;
          if (this.props.onActive) this.props.onActive(i);
          else this.setState({ active: i });
        }
      };
    });
    return {
      opacity: open ? 1 : 0,
      transform: open ? 'translateY(0) scale(1)' : 'translateY(8px) scale(0.98)',
      visibility: open ? 'visible' : 'hidden',
      pointerEvents: open ? 'auto' : 'none',
      visibilityDelay: open ? '0ms' : '200ms',
      countText: n + (n === 1 ? ' command' : ' commands'),
      hasItems: n > 0,
      isEmpty: n === 0,
      query: q,
      items: items,
      listRef: (el) => { this.listEl = el; }
    };
  }
}
</script>
</body>
</html>
