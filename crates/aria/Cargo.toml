[package]
name = "aria"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Dictation: Whisper (whisper.cpp, built in; needs cmake to build) and the microphone.
whisper-rs = "0.16"
cpal = "0.16"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
aria-core = { path = "../aria-core" }
aria-engine = { path = "../aria-engine" }
include_dir = "0.7"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The terminal client (crates/aria/src/term).
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
pulldown-cmark = { version = "0.12", default-features = false }
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
aria-hyprland = { path = "../aria-hyprland" }
whisper-rs = { version = "0.16", features = ["vulkan"] }
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
gio = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
aria-mac = { path = "../aria-mac" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"

[dev-dependencies]
aria-core = { path = "../aria-core", features = ["testing"] }
tempfile = "3"
url = "2"
