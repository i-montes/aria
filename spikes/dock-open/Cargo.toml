[package]
name = "dock-open-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway spike: does SUPER+A open the dock on the focused monitor with no edits to ~/.config/hypr?

[dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
gio = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
webkit2gtk = { version = "2.0", features = ["v2_40"] }
serde_json = "1"
